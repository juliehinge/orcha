stages:
  - evals

evals:
  stage: evals
  image: python:3.14

  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

  cache:
    paths:
      - .uv-cache/

  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv python install 3.14
    - uv sync --extra langfuse

  script:
    - uv run orcha evals sync_dataset
    - mkdir -p app/evals/eval_results

    - |
      set -o pipefail
      uv run orcha evals run \
        --model "litellm/gpt-oss-20b" \
        --langfuse \
        --samples 10 \
        | tee app/evals/eval_results/results.md

    - |
      git clone "https://oauth2:${EVAL_RESULTS_TOKEN}@${EVAL_RESULTS_REPO#https://}" eval-results-repo

      if [ -n "$CI_COMMIT_TAG" ]; then
        filename="${CI_COMMIT_TAG}.md"
      else
        filename="$(date -u +'%Y-%m-%dT%H-%M-%S').md"
      fi

      mkdir -p eval-results-repo/results
      cp app/evals/eval_results/results.md "eval-results-repo/results/${filename}"

      cd eval-results-repo
      git config user.name "Orcha CI"
      git config user.email "orcha-ci@gitlab.cern.ch"
      git add results/
      git commit -m "Add eval results: ${filename}"
      git push

  artifacts:
    when: always
    paths:
      - app/evals/eval_results/
    expire_in: 1 week

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'