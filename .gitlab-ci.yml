stages:
  - evals

evals:
  stage: evals
  image: python:3.14

  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv python install 3.14
    - uv sync --extra langfuse

  script:
    - uv run orcha evals sync_dataset
    - mkdir -p app/evals/eval_results

    # Run evaluation
    - |
      set -o pipefail
      uv run orcha evals run \
        --model "litellm/gpt-oss-20b" \
        --langfuse \
        --samples 10 \
        | tee app/evals/eval_results/results.md

    # Compare with previous report and save
    - |
      git clone \
        "https://oauth2:${EVAL_RESULTS_TOKEN}@${EVAL_RESULTS_REPO#https://}" \
        eval-results-repo

      results_dir="eval-results-repo/results"
      previous=$(ls "$results_dir"/*.md | sort | tail -n 1)

      uv run python app/evals/compare_results.py \
        "$previous" \
        app/evals/eval_results/results.md \
        > app/evals/eval_results/comparison.md

      cat app/evals/eval_results/comparison.md \
        > app/evals/eval_results/final_report.md

      printf '\n\n---\n\n' >> app/evals/eval_results/final_report.md
      cat app/evals/eval_results/results.md \
        >> app/evals/eval_results/final_report.md

      filename="$(date -u +'%Y-%m-%dT%H-%M-%S').md"
      cp app/evals/eval_results/final_report.md "$results_dir/$filename"

      cd eval-results-repo
      git config user.name "Orcha CI"
      git config user.email "orcha-ci@gitlab.cern.ch"
      git add "results/$filename"
      git commit -m "Add eval results: $filename"
      git push

  artifacts:
    when: always
    paths:
      - app/evals/eval_results/
    expire_in: 1 week

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'